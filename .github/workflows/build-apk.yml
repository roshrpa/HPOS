name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with the fixed Hollywood key
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "Secret KEYSTORE_PASSWORD is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks signing/hollywood.jks --ks-key-alias hollywood \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out hollywood-orders.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs hollywood-orders.apk | head -3

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-orders-apk
          path: hollywood-orders.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest hollywood-orders.apk \
            --title "Hollywood Orders (latest APK)" \
            --notes "Download hollywood-orders.apk on the Android tablet and install it. Updates install over the old version."
